name: AutoML App CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-app:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Verify imports
      run: |
        python -c "import streamlit; print('✓ Streamlit')"
        python -c "import plotly; print('✓ Plotly')"
        python -c "import pandas; print('✓ Pandas')"
        python -c "import sklearn; print('✓ Scikit-learn')"
        python -c "from preprocessor import DataPreprocessor; print('✓ Preprocessor')"

    - name: Check Python syntax
      run: |
        python -m py_compile app.py
        python -m py_compile preprocessor.py
        echo "✓ No syntax errors"

    - name: Verify required files exist
      run: |
        if [ ! -f "app.py" ]; then echo "❌ app.py missing"; exit 1; fi
        if [ ! -f "preprocessor.py" ]; then echo "❌ preprocessor.py missing"; exit 1; fi
        if [ ! -f "requirements.txt" ]; then echo "❌ requirements.txt missing"; exit 1; fi
        echo "✓ All required files present"

    - name: Check for model files (optional)
      run: |
        if [ -f "best_model.pkl" ]; then 
          echo "✓ Model file found"
        else
          echo "⚠️ Model file not found (expected - upload after training)"
        fi
      continue-on-error: true

    - name: Test preprocessor class
      run: |
        python -c "
        from preprocessor import DataPreprocessor
        import pandas as pd
        
        # Test initialization
        prep = DataPreprocessor()
        print('✓ DataPreprocessor initialized')
        
        # Test with sample data
        sample_data = pd.DataFrame({
            'age': [25, 30, 35],
            'workclass': ['Private', 'Private', 'Self-emp-not-inc'],
            'education': ['Bachelors', 'Masters', 'HS-grad'],
            'income': ['<=50K', '>50K', '<=50K']
        })
        
        X, y = prep.preprocess(sample_data, target_col='income', is_training=True)
        print(f'✓ Preprocessing works: {X.shape[0]} samples processed')
        "

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install linting tools
      run: |
        pip install flake8
    
    - name: Lint with flake8
      run: |
        # Check for syntax errors and undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.git,__pycache__,*.pkl,*.json
        # Check for style issues (non-blocking)
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=.git,__pycache__,*.pkl,*.json
      continue-on-error: true

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
    
    - name: Check for known vulnerabilities
      run: |
        pip install safety
        safety check --json || echo "⚠️ Some vulnerabilities found (review manually)"
      continue-on-error: true

  readme-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Check README exists
      run: |
        if [ -f "README.md" ]; then
          echo "✓ README.md found"
          wc -l README.md
        else
          echo "❌ README.md missing"
          exit 1
        fi
    
    - name: Check documentation files
      run: |
        echo "Checking documentation..."
        [ -f "SETUP_GUIDE.md" ] && echo "✓ SETUP_GUIDE.md" || echo "⚠️ SETUP_GUIDE.md missing (optional)"
        [ -f "TROUBLESHOOTING.md" ] && echo "✓ TROUBLESHOOTING.md" || echo "⚠️ TROUBLESHOOTING.md missing (optional)"
      continue-on-error: true
