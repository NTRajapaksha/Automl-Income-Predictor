name: AutoML Pipeline Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: Lint with flake8
      run: |
        pip install flake8
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      continue-on-error: true

    - name: Test data loading
      run: |
        python -c "from automl_pipeline import AdvancedAutoML; automl = AdvancedAutoML(); df = automl.load_data(); print(f'Loaded {len(df)} samples')"

    - name: Test preprocessing
      run: |
        python -c "from automl_pipeline import AdvancedAutoML; automl = AdvancedAutoML(); automl.load_data(); X_train, X_test, y_train, y_test = automl.preprocess(); print(f'Training: {len(X_train)}, Test: {len(X_test)}')"

    - name: Quick pipeline test (sample data)
      run: |
        python -c "
        from automl_pipeline import AdvancedAutoML
        import warnings
        warnings.filterwarnings('ignore')
        
        # Quick test with small sample
        automl = AdvancedAutoML()
        automl.load_data()
        automl.df = automl.df.sample(frac=0.1, random_state=42)  # 10% for speed
        automl.preprocess()
        automl.define_models()
        
        # Test just one model for speed
        from sklearn.linear_model import LogisticRegression
        from sklearn.model_selection import cross_val_score
        model = LogisticRegression(max_iter=100, random_state=42)
        model.fit(automl.X_train_scaled, automl.y_train)
        score = model.score(automl.X_test_scaled, automl.y_test)
        print(f'Quick test accuracy: {score:.4f}')
        assert score > 0.7, 'Model accuracy too low'
        "

    - name: Check generated files
      run: |
        # Verify no errors in import
        python -c "import automl_pipeline; import app; print('Imports successful')"

    - name: Generate coverage report
      run: |
        echo "Coverage report would go here"
      continue-on-error: true

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: test-results-${{ matrix.python-version }}
        path: |
          *.png
          *.pkl
        retention-days: 7

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install linting tools
      run: |
        pip install black isort flake8
    
    - name: Check code formatting with black
      run: black --check --diff .
      continue-on-error: true
    
    - name: Check import sorting with isort
      run: isort --check-only --diff .
      continue-on-error: true

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install security tools
      run: |
        pip install safety bandit
    
    - name: Check for known vulnerabilities
      run: |
        pip install -r requirements.txt
        safety check --json
      continue-on-error: true
    
    - name: Run bandit security scan
      run: |
        bandit -r . -f json -o bandit-report.json
      continue-on-error: true